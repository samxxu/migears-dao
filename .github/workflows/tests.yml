name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    # composer.json resolves migears/sql, migears/domain, migears/validator and
    # migears/cache through path repositories ("../migears-*") and none of them
    # is on Packagist, so they have to sit beside this package rather than under
    # vendor/. That is also why every command runs from a subdirectory: those
    # paths are relative to this package's own directory, so this package cannot
    # be checked out at the workspace root.
    defaults:
      run:
        working-directory: migears-dao

    steps:
      - name: Check out this package
        uses: actions/checkout@v7
        with:
          path: migears-dao

      # Their default branches, so the set moves together.
      - name: Check out migears-sql
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/migears-sql
          path: migears-sql

      - name: Check out migears-domain
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/migears-domain
          path: migears-domain

      - name: Check out migears-validator
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/migears-validator
          path: migears-validator

      - name: Check out migears-cache
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/migears-cache
          path: migears-cache

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The suite opens its own `sqlite::memory:` connection, so only the
          # driver has to be there — no service container.
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Tests
        run: vendor/bin/phpunit
